[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nmr-peak-assign"
version = "0.1.0"
description = "Sort crude 1H NMR peaks into product, leftover reactants, solvent and unexplained signals"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yingjie Shan" }]
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
peakassign = "peakassign.cli:main"

[tool.setuptools]
packages = ["peakassign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
